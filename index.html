<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORPEN · Setup do Ambiente & IA Auditora</title>
  
  <!-- Fontes Oficiais ORPEN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --ink: #180D2E;
      --ink-2: #3E2963;
      --muted: #6B5B88;
      --line: #E5E0F2;
      --canvas: #F8F6FC;
      --surface: #FFFFFF;
      --surface-2: #F6F4FB;
      --signal: #7C3AED;
      --signal-soft: #EDE9FE;
      --signal-deep: #5B21B6;
      --amber: #D97706;
      --amber-soft: #FEF3C7;
      --rose: #DC2626;
      --rose-soft: #FEE2E2;
      --ok: #10B981;
      --ok-soft: #D1FAE5;
      --r: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: "IBM Plex Sans", -apple-system, Segoe UI, sans-serif;
      font-size: 14.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .disp {
      font-family: "Archivo", "IBM Plex Sans", sans-serif;
      letter-spacing: -.015em;
    }

    code, .mono, input.mono {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }

    /* ---------- top bar ---------- */
    .top {
      position: sticky;
      top: 0;
      z-index: 40;
      background: #1B0D38;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 22px;
      border-bottom: 1px solid rgba(139, 92, 246, 0.22);
    }

    .brand {
      display: flex;
      align-items: center;
    }

    .brand img {
      height: 32px;
      width: auto;
      display: block;
    }

    .top .who {
      font-size: 13px;
      color: #C4B5FD;
      border-left: 1px solid #361E63;
      padding-left: 18px;
    }

    .top .who b {
      color: #fff;
      font-weight: 600;
    }

    .top .right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .saved {
      font-size: 12px;
      color: #DDD6FE;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      display: inline-block;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .pbar {
      width: 150px;
      height: 6px;
      background: #341B64;
      border-radius: 99px;
      overflow: hidden;
    }

    .pbar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #C084FC, #8B5CF6, #6366F1);
      width: 0;
      transition: width .4s cubic-bezier(.2, .8, .2, 1);
    }

    .ppct {
      font-family: "IBM Plex Mono";
      font-size: 12px;
      color: #EDE9FE;
      min-width: 38px;
      text-align: right;
    }

    /* ---------- layout ---------- */
    .wrap {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr) 310px;
      gap: 26px;
      max-width: 1380px;
      margin: 0 auto;
      padding: 26px 22px 90px;
    }

    /* ---------- rail ---------- */
    .rail {
      position: sticky;
      top: 74px;
      align-self: start;
    }

    .rail .kicker {
      font-size: 10.5px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px 4px;
    }

    .step {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 8px 8px;
      border-radius: 8px;
      color: var(--ink-2);
      font: inherit;
      font-size: 13.5px;
    }

    .step:hover {
      background: var(--signal-soft);
    }

    .step.on {
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(124, 58, 237, .08);
      border-left: 3px solid var(--signal);
      color: var(--signal-deep);
      font-weight: 600;
    }

    .step .mk {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      display: grid;
      place-items: center;
      font-family: "IBM Plex Mono";
      font-size: 11px;
      color: var(--muted);
    }

    .step.done .mk {
      background: var(--signal);
      border-color: var(--signal);
      color: #fff;
    }

    .step.part .mk {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-soft);
    }

    .step .lbl {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .railnote {
      margin: 14px 4px 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    /* ---------- card / fields ---------- */
    .card {
      background: var(--surface);
      border-radius: var(--r);
      box-shadow: 0 2px 12px rgba(27, 13, 56, .05);
      border: 1px solid var(--line);
      padding: 26px 28px;
      margin-bottom: 18px;
    }

    .eyebrow {
      font-family: "IBM Plex Mono";
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--signal);
      font-weight: 700;
      margin: 0 0 4px;
    }

    h2 {
      font-size: 21px;
      margin: 0 0 6px;
      font-weight: 700;
      color: var(--ink);
    }

    .lede {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 22px;
      line-height: 1.45;
    }

    .sect {
      margin: 24px 0 12px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .sect h3 {
      font-size: 14.5px;
      margin: 0 0 3px;
      font-weight: 600;
      color: var(--ink);
    }

    .sect p {
      font-size: 12.5px;
      color: var(--muted);
      margin: 0;
    }

    .f {
      margin-bottom: 14px;
    }

    .f label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 5px;
    }

    .req {
      color: var(--rose);
      font-weight: 700;
    }

    input[type=text], input[type=email], input[type=tel], input[type=date], textarea, select {
      width: 100%;
      font: inherit;
      font-size: 13.5px;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 7px;
      padding: 8px 11px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--signal);
      box-shadow: 0 0 0 3px var(--signal-soft);
    }

    input.bad, textarea.bad {
      border-color: var(--rose);
      background: #FFFDFC;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    .hint {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
      display: block;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    /* ---------- buttons / options ---------- */
    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .opt {
      font: inherit;
      font-size: 13px;
      background: var(--surface-2);
      border: 1.5px solid var(--line);
      border-radius: 7px;
      padding: 7px 13px;
      cursor: pointer;
      color: var(--ink-2);
      transition: .15s;
    }

    .opt:hover {
      border-color: var(--signal-deep);
      background: #F3EEFB;
    }

    .opt[aria-pressed=true] {
      background: var(--signal-soft);
      border-color: var(--signal);
      color: var(--signal-deep);
      font-weight: 600;
    }

    .opt.sm {
      font-size: 12px;
      padding: 5px 10px;
    }

    .btn {
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 7px;
      padding: 9px 16px;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: .15s;
    }

    .btn-p {
      background: linear-gradient(135deg, #7C3AED, #6D28D9);
      color: #fff;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
    }

    .btn-p:hover {
      background: linear-gradient(135deg, #6D28D9, #5B21B6);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
    }

    .btn-s {
      background: var(--surface-2);
      color: var(--ink-2);
      border: 1.5px solid var(--line);
    }

    .btn-s:hover {
      border-color: #C4B5FD;
      background: #F3EEFB;
    }

    .btn-g {
      background: none;
      color: var(--signal);
      padding: 6px 10px;
      font-size: 12.5px;
      border: 0;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-g:hover {
      text-decoration: underline;
      color: var(--signal-deep);
    }

    .navrow {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .navrow .sp {
      margin-left: auto;
    }

    /* ---------- tags / lists ---------- */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .tag button {
      background: none;
      border: 0;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }

    .tag button:hover {
      color: var(--rose);
    }

    /* ---------- tables ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 7px 6px;
      border-bottom: 1.5px solid var(--line);
    }

    td {
      padding: 6px;
      border-bottom: 1px solid #F0ECF8;
      vertical-align: middle;
    }

    td input, td select {
      font-size: 12.5px;
      padding: 6px 8px;
    }

    .rowdel {
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
    }

    .rowdel:hover {
      color: var(--rose);
    }

    /* ---------- notes / alerts ---------- */
    .note {
      border-radius: 7px;
      padding: 11px 13px;
      font-size: 12.5px;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .note.info {
      background: var(--surface-2);
      border-left: 3px solid var(--signal);
      color: var(--ink-2);
    }

    .note.warn {
      background: var(--amber-soft);
      border-left: 3px solid var(--amber);
      color: #78350F;
    }

    /* ---------- side summary ---------- */
    .sum {
      position: sticky;
      top: 74px;
      align-self: start;
      background: #1B0D38;
      color: #fff;
      border-radius: var(--r);
      padding: 20px 18px;
      font-size: 13px;
      border: 1px solid #331A61;
      box-shadow: 0 4px 20px rgba(27, 13, 56, .12);
    }

    .sum h3 {
      font-size: 14px;
      margin: 0 0 2px;
      color: #EDE9FE;
      font-weight: 700;
    }

    .sum .cli {
      font-size: 12px;
      color: #C4B5FD;
      margin: 0 0 14px;
    }

    .tier-box {
      background: #281452;
      border: 1px solid #3D1F75;
      border-radius: 8px;
      padding: 12px 13px;
      margin-bottom: 12px;
    }

    .tier-box p {
      margin: 0;
      font-size: 12px;
      color: #C4B5FD;
      line-height: 1.4;
    }

    .tier-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .04em;
      margin-bottom: 6px;
      font-family: "IBM Plex Mono";
    }

    .tier-prata {
      background: #E2E8F0;
      color: #1E293B;
    }

    .tier-gold {
      background: #FEF3C7;
      color: #92400E;
    }

    .tier-diamante {
      background: #EDE9FE;
      color: #5B21B6;
    }

    .tier-consultor {
      background: linear-gradient(135deg, #9333EA, #4F46E5);
      color: #fff;
    }

    .meter-track {
      width: 100%;
      height: 6px;
      background: #341B64;
      border-radius: 99px;
      overflow: hidden;
      margin: 6px 0;
    }

    .meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #C084FC, #8B5CF6);
      border-radius: 99px;
      transition: width .4s ease;
    }

    .ambig-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .ambig-ok {
      color: #34D399;
      font-weight: bold;
    }

    .ambig-warn {
      color: #FBBF24;
      font-weight: bold;
    }

    .sline {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #2B1652;
      font-size: 12px;
    }

    .sline .k {
      color: #A78BFA;
    }

    .sline .v {
      font-weight: 600;
      color: #fff;
      font-family: "IBM Plex Mono";
    }

    .sline .v.dim {
      color: #7C689E;
      font-weight: 400;
    }

    .pend {
      margin-top: 14px;
      background: #281452;
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid #3D1F75;
    }

    .pend h4 {
      margin: 0 0 6px;
      font-size: 11.5px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #FBBF24;
      font-weight: 700;
    }

    .pend button {
      display: block;
      background: none;
      border: 0;
      color: #FDE68A;
      font: inherit;
      font-size: 12.5px;
      text-align: left;
      padding: 3px 0;
      cursor: pointer;
      line-height: 1.35;
    }

    .pend button:hover {
      color: #fff;
      text-decoration: underline;
    }

    .done-box {
      background: #143026;
      border-radius: 8px;
      padding: 12px 13px;
      margin-top: 14px;
      color: #6EE7B7;
      font-size: 12.5px;
      border: 1px solid #1E5C47;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      background: #1B0D38;
      color: #fff;
      padding: 12px 20px;
      border-radius: 9px;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: .28s;
      z-index: 60;
      border: 1px solid #4C1D95;
      box-shadow: 0 8px 24px rgba(27, 13, 56, .4);
    }

    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- node editor (bot) ---------- */
    .node {
      background: var(--surface-2);
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .node .hd {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .keycap {
      font-family: "IBM Plex Mono";
      background: #1B0D38;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .sub-node {
      margin-top: 10px;
      padding-left: 14px;
      border-left: 2px solid var(--line);
    }

    .pre {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 12px;
      background: var(--surface-2);
      border-radius: 7px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .pre input[type=checkbox] {
      margin-top: 3px;
      accent-color: var(--signal);
    }

    .pre p {
      margin: 0;
      font-weight: 500;
    }

    .pre p.sub {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 400;
    }

    .pre input[type=text] {
      margin-left: auto;
      max-width: 140px;
      font-size: 12px;
      padding: 4px 8px;
    }

    /* ---------- Modal de Prompt Final ---------- */
    .prompt-modal-backdrop {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(27, 13, 56, .75) !important;
      backdrop-filter: blur(4px);
      z-index: 9999 !important;
      display: none !important;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .prompt-modal-backdrop.open {
      display: flex !important;
    }

    .prompt-modal {
      background: #fff;
      border-radius: 14px;
      max-width: 860px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(27, 13, 56, .45);
      overflow: hidden;
      animation: modalPop .2s ease-out;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .prompt-modal-header {
      background: #1B0D38;
      color: #fff;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #361E63;
    }

    .prompt-modal-header h3 {
      margin: 0;
      font-size: 15.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #fff;
    }

    .prompt-modal-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
      background: #F9F8FD;
    }

    .prompt-box-code {
      background: #0F0720;
      color: #E9D5FF;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      padding: 16px 18px;
      border-radius: 8px;
      white-space: pre-wrap;
      border: 1px solid #281452;
      max-height: 440px;
      overflow-y: auto;
      margin: 0;
    }

    .prompt-modal-footer {
      padding: 14px 22px;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-prompt-stat {
      background: rgba(255, 255, 255, 0.12);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11.5px;
      font-family: 'IBM Plex Mono', monospace;
      color: #DDD6FE;
    }

    @media (max-width:1080px) {
      .wrap {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 16px 14px 70px;
      }
      .rail {
        position: static;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .rail .kicker, .railnote {
        display: none;
      }
      .step {
        width: auto;
        flex: 0 0 auto;
        grid-template-columns: 20px auto;
        background: var(--surface);
      }
      .sum {
        position: static;
        order: 3;
      }
      .grid2, .grid3 {
        grid-template-columns: 1fr;
      }
      .card {
        padding: 20px 17px;
      }
      .top {
        padding: 10px 14px;
        gap: 12px;
      }
      .top .who {
        display: none;
      }
      .pbar {
        width: 80px;
      }
    }

    /* ---------- Header Compacto da Aba Assistente de IA ---------- */
    .ia-step-header {
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--line);
    }
    .ia-step-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .ia-step-badge-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ia-step-tag {
      display: inline-flex;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--signal-deep);
      background: var(--signal-soft);
      padding: 4px 9px;
      border-radius: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .ia-step-title-text {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--ink);
      margin: 0;
    }
    .ia-step-progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 170px;
      flex: 0 1 230px;
    }
    .ia-step-line-track {
      flex: 1;
      height: 6px;
      background: #E5E0F2;
      border-radius: 99px;
      overflow: hidden;
    }
    .ia-step-line-fill {
      height: 100%;
      background: linear-gradient(90deg, #9333EA, #7C3AED);
      border-radius: 99px;
      transition: width .3s ease;
    }
    .ia-step-pct-val {
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      color: var(--signal-deep);
      min-width: 36px;
      text-align: right;
    }
    .ia-mini-steps {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .ia-mini-steps::-webkit-scrollbar {
      display: none;
    }
    .ia-mini-step-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s ease;
    }
    .ia-mini-step-btn:hover {
      background: var(--surface-2);
      color: var(--ink-2);
    }
    .ia-mini-step-btn.active {
      background: var(--signal-soft);
      color: var(--signal-deep);
      font-weight: 600;
      border-color: #DDD6FE;
    }
    .ia-mini-step-btn.done {
      color: var(--ink-2);
    }
    .ia-mini-step-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #E5E0F2;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 9.5px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
    }
    .ia-mini-step-btn.active .ia-mini-step-dot {
      background: var(--signal);
      color: #fff;
    }
    .ia-mini-step-btn.done .ia-mini-step-dot {
      background: #10B981;
      color: #fff;
    }

    /* ---------- Interactive Chips & Quick Templates ---------- */
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .chip-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .btn-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--signal-deep);
      background: var(--surface);
      border: 1.5px solid #DDD6FE;
      border-radius: 99px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all .15s ease;
      box-shadow: 0 1px 3px rgba(124, 58, 237, 0.04);
    }
    .btn-chip:hover {
      background: var(--signal-soft);
      border-color: var(--signal);
      color: var(--signal-deep);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.12);
    }
    .btn-chip:active {
      transform: scale(0.98);
    }
    .btn-chip.template {
      background: #FAF5FF;
      border-color: #C084FC;
      color: #6B21A8;
      font-weight: 600;
    }
    .btn-chip.template:hover {
      background: #F3E8FF;
      border-color: #9333EA;
      box-shadow: 0 2px 8px rgba(147, 51, 234, 0.18);
    }

    /* ---------- Add Step & Flow Action Buttons ---------- */
    .btn-add-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--signal-deep);
      background: #fff;
      border: 1.5px dashed #C4B5FD;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .btn-add-step:hover {
      background: var(--signal-soft);
      border-color: var(--signal);
      color: var(--signal-deep);
      border-style: solid;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.12);
    }
    .btn-add-step:active {
      transform: scale(0.99);
    }

    .flow-card {
      background: #FAF8FE;
      border: 1.5px solid #E5E0F2;
      border-radius: var(--r);
      padding: 18px 20px;
      margin-bottom: 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    .flow-card:hover {
      border-color: #C4B5FD;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.06);
    }
    .flow-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ECE7F6;
    }
    .flow-title-input {
      font-weight: 700 !important;
      background: #fff !important;
      border: 1.5px solid #DDD6FE !important;
      border-radius: 7px !important;
      font-size: 13.5px !important;
      color: var(--ink) !important;
      padding: 7px 12px !important;
      width: 100%;
    }
    .flow-title-input:focus {
      border-color: var(--signal) !important;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15) !important;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      background: #fff;
      border: 1.5px solid #E5E0F2;
      border-radius: 8px;
      padding: 5px 10px 5px 8px;
      transition: border-color .15s, box-shadow .15s;
    }
    .step-item:focus-within {
      border-color: var(--signal);
      box-shadow: 0 0 0 2.5px rgba(124, 58, 237, 0.12);
    }
    .step-item input {
      border: 0 !important;
      background: transparent !important;
      padding: 5px 6px !important;
      box-shadow: none !important;
      font-size: 13px !important;
      flex: 1;
    }
    .step-num-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--signal-soft);
      color: var(--signal-deep);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11.5px;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .file-upload-zone {
      border: 2px dashed #C4B5FD;
      border-radius: var(--r);
      padding: 18px;
      text-align: center;
      background: #FAF8FE;
      cursor: pointer;
      transition: .15s;
    }
    .file-upload-zone:hover {
      border-color: var(--signal);
      background: var(--signal-soft);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

    function responderRapido(txt) {
      const inp = document.getElementById("chat_user_input");

    async function enviarChatUser() {
      const inp = document.getElementById("chat_user_input");
      if (!inp) return;
      const userText = inp.value.trim();
      if (!userText) return;
      inp.value = "";

      AUDITOR_CHAT_MESSAGES.push({ sender: "user", text: userText });
      document.getElementById("chat_stream").innerHTML = renderChatMessages();
      const stream = document.getElementById("chat_stream");
      if (stream) stream.scrollTop = stream.scrollHeight;

      const key = getOpenAIKey();

      if (key && key.startsWith("sk-")) {
        try {
          const resp = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
            body: JSON.stringify({
              model: "gpt-4o-mini",
              messages: [
                { role: "system", content: "Você é a IA Auditora da ORPEN (motor 5.6 Sol). Audite e colete os dados do assistente de atendimento do cliente. Indague sobre ambiguidades e determine o plano ideal (Prata, Gold ou Diamante) de forma acolhedora e precisa." },
                ...AUDITOR_CHAT_MESSAGES.map(m => ({ role: m.sender === 'bot' ? 'assistant' : 'user', content: m.text }))
              ]
            })
          });
          const data = await resp.json();
          if (data.choices && data.choices[0]) {
            const botReply = data.choices[0].message.content;
            AUDITOR_CHAT_MESSAGES.push({ sender: "bot", text: botReply });
            processarExtracaoConversacional(userText);
            draw();
            return;
          }
        } catch (err) {
          console.warn("Falha na chamada da OpenAI API, usando motor 5.6 Sol simulado.", err);
        }
      }

      setTimeout(() => {
        processarFluxoAuditoraSimulado(userText);
        draw();
      }, 350);
    }

    function processarFluxoAuditoraSimulado(userText) {
      let botReply = "";

      if (AUDITOR_STEP === 0) {
        const partes = userText.split(/,|;|-|\./);
        const nomeDetectado = partes[0].replace(/meu assistente|chame|nome|é|vai ser/gi, "").trim();
        S.ia.nome = nomeDetectado || "Ires";
        if (/formal|institucional/i.test(userText)) S.ia.tom = ["Formal e institucional"];
        else if (/consultivo|técnico/i.test(userText)) S.ia.tom = ["Técnico e consultivo"];
        else S.ia.tom = ["Cordial e acolhedor", "Direto e objetivo"];

        AUDITOR_STEP = 1;
        botReply = `Perfeito! O assistente se chamará **${S.ia.nome}** com tom **${S.ia.tom.join(" e ")}**.\n\nAgora me conte: **Qual é o público-alvo principal e quais problemas operacionais você deseja que a ${S.ia.nome} resolva no WhatsApp?**`;
      }
      else if (AUDITOR_STEP === 1) {
        S.ia.publicoAlvo = userText;
        S.ia.problema = userText;
        S.ia.kpis = "Resolução no 1º contato acima de 40% e redução do tempo de espera.";
        AUDITOR_STEP = 2;
        botReply = `Entendido! Alinhei os objetivos de negócio.\n\n**O que a ${S.ia.nome} terá AUTONOMIA TOTAL para resolver sozinha?** (Ex.: informar horários, listar convênios aceitos, orientações de exames ou enviar links).`;
      }
      else if (AUDITOR_STEP === 2) {
        if (/tudo|qualquer|sem limites|tudo que o cliente pedir/i.test(userText)) {
          botReply = `⚠️ **Alerta de Ambiguidade:** Permitir 'tudo' gera alto risco de alucinação e respostas fora de escopo.\n\nPara mantermos a precisão, **quais são os tópicos principais que ela está estritamente PROIBIDA de fazer?** (Ex.: diagnóstico médico, prometer encaixes, passar laudos sem autorização).`;
          S.ia.habilidades = "- Consulta de informações institucionais e convênios\n- Orientações de preparo de exames\n- Envio de links de agendamento";
          AUDITOR_STEP = 3;
        } else {
          S.ia.habilidades = userText;
          AUDITOR_STEP = 3;
          botReply = `Excelente mapeamento de escopo.\n\nPara proteger sua operação contra alucinações: **O que a ${S.ia.nome} está terminantemente PROIBIDA de responder ou prometer?**`;
        }
      }
      else if (AUDITOR_STEP === 3) {
        S.ia.restricoes = userText;
        AUDITOR_STEP = 4;
        loadIaTemplates();
        botReply = `Ótimo! Regras anti-alucinação registradas com prioridade máxima.\n\nAgora sobre o **Transbordo Humano (Smart Jump)**: Se o cliente falar sobre *emergência, dor intensa, reclamações financeiras ou pedir atendente*, para quais setores devemos transferir na hora?`;
      }
      else if (AUDITOR_STEP === 4) {
        AUDITOR_STEP = 5;

    function avaliarTierIa() {
      const temInteg = S.contrato.integracao && S.integ.sistema;
      const temApi = S.integ.temApi === 'sim';
      const temCasosComplexos = S.integ.casos.some(c => /marcar|remarcar|laudo|exame/i.test(c));
      const temSmartJump = S.ia.smartJump && S.ia.smartJump.length >= 2;
      const totalPassosFluxos = (S.ia.fluxosPreAtendimento || []).reduce((acc, f) => acc + (f.passos || []).filter(Boolean).length, 0);
      const temPreColeta = totalPassosFluxos >= 2;
      const temRestricoes = (S.ia.restricoes || "").length > 20;
      const temBaseExtensa = (S.ia.habilidades || "").length > 100 || (S.ia.faqTexto || "").length > 100;
      const temArquivosOuLinks = (S.ia.arquivos && S.ia.arquivos.length > 0) || (S.ia.linksAdicionais && S.ia.linksAdicionais.length > 0);

      let score = 20;
      if (S.ia.nome) score += 5;
      if (S.ia.tom && S.ia.tom.length > 1) score += 5;
      if (S.ia.idiomas && S.ia.idiomas.length > 1) score += 5;
      if (temRestricoes) score += 10;
      if (temSmartJump) score += 15;
      if (temPreColeta) score += 15;
      if (temBaseExtensa || temArquivosOuLinks) score += 10;
      if (temInteg) score += 15;
      if (score > 100) score = 100;

      let complexidadeNivel = "Baixa";
      if (score > 35) complexidadeNivel = "Moderada";
      if (score > 65) complexidadeNivel = "Avançada";
      if (score > 85) complexidadeNivel = "Alta Densidade";

      const ambiguidades = [];
      if (!temRestricoes) {
        ambiguidades.push({ tipo: "warn", txt: "Restrições vagas: Adicione limites claros anti-alucinação." });
      } else {
        ambiguidades.push({ tipo: "ok", txt: "Limites e regras anti-alucinação bem definidos." });
      }

      if (!temSmartJump) {
        ambiguidades.push({ tipo: "warn", txt: "Transbordo sensível: Poucos gatilhos de Smart Jump cadastrados." });
      } else {
        ambiguidades.push({ tipo: "ok", txt: `${S.ia.smartJump.length} regras de transbordo inteligente ativas.` });
      }

      if (!temPreColeta) {
        ambiguidades.push({ tipo: "warn", txt: "Sem pré-qualificação: Nenhum passo configurado nos fluxos de triagem." });
      } else {
        ambiguidades.push({ tipo: "ok", txt: `${(S.ia.fluxosPreAtendimento || []).length} fluxo(s) de pré-atendimento com ${totalPassosFluxos} passo(s) ao todo.` });
      }

      if (temInteg && temCasosComplexos && temBaseExtensa && temPreColeta && temSmartJump) {
        return {
          tier: "Plano Diamante+",
          badgeClass: "tier-consultor",
          score,
          complexidadeNivel,
          ambiguidades,
          desc: "Arquitetura com integração a ERP/APIs em tempo real, transbordo multi-departamental e validação contínua."
        };
      }
      if (temInteg || temApi || temCasosComplexos) {
        return {
          tier: "Plano Diamante",
          badgeClass: "tier-diamante",
          score,
          complexidadeNivel,
          ambiguidades,
          desc: "Capacidade transacional com chamadas de ferramentas/APIs, consulta a bancos de dados e roteamento prioritário."
        };
      }
      if (temBaseExtensa || S.ia.baseUrl || temSmartJump || temArquivosOuLinks) {
        return {
          tier: "Plano Gold",
          badgeClass: "tier-gold",
          score,
          complexidadeNivel,
          ambiguidades,
          desc: "Estrutura com base de conhecimento (RAG), regras anti-alucinação e triagem inteligente para múltiplos setores."
        };
      }
      return {
        tier: "Plano Prata",
        badgeClass: "tier-prata",
        score,
        complexidadeNivel,
        ambiguidades,
        desc: "Atendimento direto alimentado com regras ágeis de triagem e respostas em system prompt."
      };
    }

    function gerarPromptFinalCompilado() {
      const nome = S.ia.nome || "Assistente Virtual";
      const empresa = S.contrato.razaoSocial || "Empresa";
      const tom = (S.ia.tom && S.ia.tom.length) ? S.ia.tom.join(", ") : "Cordial, acolhedor e direto";
      const idiomas = (S.ia.idiomas && S.ia.idiomas.length) ? S.ia.idiomas.join(", ") : "Português (Brasil)";
      const emoji = S.ia.emojiUso === 'nenhum' ? "Não utilize emojis." : `Utilize emojis com moderação (${S.ia.emojisPermitidos || '💙, 👋, 🏥, ✅'}).`;
      const extensao = S.ia.extensaoResp === 'curta' ? "Respostas curtas e objetivas (máximo 2 a 3 frases por mensagem)." : (S.ia.extensaoResp === 'media' ? "Respostas médias (4 a 6 linhas estruturadas)." : "Respostas flexíveis e bem contextualizadas.");

      let prompt = `### 1. PERSONA E PAPEL DO ASSISTENTE
Você é ${nome}, o assistente virtual oficial de atendimento da empresa ${empresa}.
Seu papel é recepcionar clientes no WhatsApp com excelência, tirar dúvidas frequentes e qualificar a conversa antes de qualquer encaminhamento humano.

### 2. DIRETRIZES DE COMUNICAÇÃO
- Tom de voz: ${tom}.
- Extensão das respostas: ${extensao}
- Idiomas atendidos: ${idiomas}.
- Diretrizes de Emojis: ${emoji}
- Clareza: Use linguagem acolhedora, objetiva e sem jargões técnicos desnecessários.

### 3. ALINHAMENTO DE EXPECTATIVAS E OBJETIVOS
${S.ia.processoOtimizar ? `- Processo a otimizar: ${S.ia.processoOtimizar}` : '- Processo: Triagem ágil e redução de espera'}
${S.ia.kpis ? `- Métricas e KPIs de sucesso: ${S.ia.kpis}` : ''}
${S.ia.publicoAlvo ? `- Perfil do público-alvo: ${S.ia.publicoAlvo}` : ''}

### 4. ESCOPO E AUTONOMIA TOTAL
Você tem AUTONOMIA TOTAL para resolver diretamente os seguintes assuntos:
${S.ia.habilidades ? S.ia.habilidades : '- Fornecer informações institucionais, horários e orientações gerais'}

### 5. GATILHOS DE TRANSBORDO HUMANO
Transfira o atendimento para um atendente humano quando houver:
${S.ia.assuntosTransbordo ? S.ia.assuntosTransbordo : '- Solicitação explícita de atendente ou casos complexos fora de escopo'}

### 6. RESTRIÇÕES CRÍTICAS (ANTI-ALUCINAÇÃO & GUARDRAILS)
${S.ia.restricoes ? S.ia.restricoes : '- NUNCA forneça informações não confirmadas oficialmente pela empresa\n- NUNCA invente procedimentos, prazos ou valores'}
${S.ia.foraEscopo ? `- Assuntos fora de escopo (recusar cordialmente): ${S.ia.foraEscopo}` : ''}
`;

      if (S.ia.smartJump && S.ia.smartJump.length > 0) {
        prompt += `\n### 7. REGRAS DE ROTEAMENTO IMEDIATO (SMART JUMP)\nSe o cliente mencionar algum dos gatilhos abaixo, interrompa a triagem e transfira IMEDIATAMENTE para a fila indicada:\n`;
        S.ia.smartJump.forEach((r, idx) => {
          prompt += `${idx + 1}. [${r.categoria || 'Intenção'}]: Gatilhos ("${r.gatilhos || ''}") -> Transferir para Fila: ${r.destino || 'Atendimento Geral'}\n`;
        });
      }

      if (S.ia.fluxosPreAtendimento && S.ia.fluxosPreAtendimento.length > 0) {
        prompt += `\n### 8. PRÉ-ATENDIMENTO E COLETA SEQUENCIAL POR FLUXO\nIdentifique o fluxo correspondente à solicitação do cliente e realize a coleta de dados de forma SEQUENCIAL (uma pergunta por vez):\n`;
        S.ia.fluxosPreAtendimento.forEach((f, idx) => {
          prompt += `\n▶ FLUXO ${idx + 1}: ${f.nome || 'Geral'}\n`;
          (f.passos || []).forEach((passo, pIdx) => {
            if (passo.trim()) {
              prompt += `   Passo ${pIdx + 1}: "${passo.trim()}"\n`;
            }
          });
        });
        if (S.ia.filaFallback) {
          prompt += `\n* Se a IA não identificar o fluxo do cliente ou houver falha de compreensão, encaminhar para a Fila de Contingência: ${S.ia.filaFallback}.\n`;
        }
      }

      if (S.ia.baseUrl || (S.ia.linksAdicionais && S.ia.linksAdicionais.length) || S.ia.faqTexto || (S.ia.arquivos && S.ia.arquivos.length)) {
        prompt += `\n### 9. BASE DE CONHECIMENTO E GOVERNANÇA\n`;
        if (S.ia.baseUrl) prompt += `- Site oficial: ${S.ia.baseUrl}\n`;
        if (S.ia.linksAdicionais && S.ia.linksAdicionais.length) {
          const validLinks = S.ia.linksAdicionais.filter(Boolean);
          if (validLinks.length) prompt += `- Links adicionais de consulta: ${validLinks.join(" | ")}\n`;
        }
        if (S.ia.faqTexto) {
          prompt += `- Informações e Procedimentos Oficiais:\n${S.ia.faqTexto}\n`;
        }
        if (S.ia.arquivos && S.ia.arquivos.length) {
          prompt += `- Documentos e Manuais de Referência: ${S.ia.arquivos.map(a => a.nome).join(", ")}\n`;
        }
        if (S.ia.faqFreq) {
          prompt += `- Governança de atualização: Frequência ${S.ia.faqFreq}.\n`;
        }
        if (S.ia.faqRespNome || S.ia.faqRespEmail) {
          prompt += `- Responsável interno: ${S.ia.faqRespNome || ''} (${S.ia.faqRespEmail || ''})\n`;
        }
      }

      prompt += `\n### 10. POLÍTICA DE INATIVIDADE E FALLBACK\n`;
      prompt += `- Tempo de inatividade limite: ${S.ia.inatTempo || '10'} minutos.\n`;
      prompt += `- Ação ao esgotar inatividade: ${S.ia.inatAcao === 'transferir' ? `Transferir para ${S.ia.inatFila || 'fila padrão'}` : 'Encerrar conversa'}.\n`;
      if (S.ia.msgFinalizacao) {
        prompt += `- Mensagem de encerramento por inatividade: "${S.ia.msgFinalizacao}"\n`;
      }
      prompt += `- Caso não compreenda a solicitação após ${S.ia.tentativasErro || '3'} tentativas consecutivas, acione o transbordo para a equipe humana.\n`;
      prompt += `- NUNCA invente procedimentos, dados de contato ou regras não expressas neste documento.`;

      return prompt;
    }

        render() {

            ${pend.length ? `<div class="note warn"><b>Faltam ${pend.length} ${pend.length === 1 ? "item" : "itens"}.</b> Você pode enviar assim mesmo — a ORPEN começa a configurar o que já está pronto e cobra o resto por aqui.</div>

    /* ============================================================
       CONTROLADOR PRINCIPAL (APP)
       ============================================================ */
    let cur = "contrato";
    const visible = () => BLOCKS.filter(b => b.when());

    function allPending() {
      const out = [];
      visible().forEach(b => b.check().forEach(t => out.push({ id: b.id, bloco: b.nome, txt: t })));
      return out;
    }

    function progress() {
      const v = visible().filter(b => b.id !== "revisao");
      const tot = v.length;
      const ok = v.filter(b => !b.check().length).length;
      return Math.round(ok / tot * 100);
    }

    function go(id) {
      cur = id;
      draw();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function draw() {
      const v = visible();
      const topCli = document.getElementById("topcli");
      if (topCli) topCli.textContent = S.contrato.razaoSocial;

      const rail = document.getElementById("rail");
      if (rail) {
        rail.innerHTML = '<p class="kicker">Blocos</p>' +
          v.map((b, i) => {
            const p = b.check().length;
            const st = b.id === "revisao" ? "" : (p === 0 ? "done" : "part");
            return `<button class="step ${b.id === cur ? "on" : ""} ${st}" onclick="go('${b.id}')">
              <span class="mk">${st === "done" ? "✓" : i + 1}</span>
              <span class="lbl">${b.nome}</span>
            </button>`;
          }).join("") +
          `<p class="railnote">Blocos que não se aplicam ao seu contrato ficam ocultos. Você pode enviar cada bloco para uma pessoa diferente.</p>`;
      }

      const main = document.getElementById("main");
      const currentBlock = BLOCKS.find(b => b.id === cur);
      if (main && currentBlock) {
        main.innerHTML = currentBlock.render();
      }

      soft();
    }

    function soft() {
      const pc = progress();
      const pbar = document.getElementById("pbar");
      const ppct = document.getElementById("ppct");
      if (pbar) pbar.style.width = pc + "%";
      if (ppct) ppct.textContent = pc + "%";
      drawSum();
    }

    function drawSum() {
      const sumEl = document.getElementById("sum");
      if (!sumEl) return;

      const c = S.contrato;
      const pend = allPending();
      const line = (k, v, dim) => `<div class="sline"><span class="k">${k}</span><span class="v ${dim ? "dim" : ""}">${esc(v)}</span></div>`;

      if (c.ia) {
        // Assistente de IA selecionado -> Exibe os diagnósticos e métricas da IA
        const diag = avaliarTierIa();
        const totalFluxos = (S.ia.fluxosPreAtendimento || []).length;
        const totalPassos = (S.ia.fluxosPreAtendimento || []).reduce((acc, f) => acc + (f.passos || []).filter(Boolean).length, 0);

        sumEl.innerHTML = `
          <h3>Assistente de IA</h3>
          <p class="cli">${esc(c.razaoSocial || "Cliente ORPEN")}</p>

          <div class="tier-box">
            <span style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#C4B5FD;font-weight:700;display:block;margin-bottom:4px">Plano Compreendido</span>
            <span class="tier-badge ${diag.badgeClass}">${diag.tier}</span>
            <p style="margin-top:4px">${diag.desc}</p>
          </div>

          <div style="background:#281452;border:1px solid #3D1F75;border-radius:8px;padding:11px 12px;margin:10px 0">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#C4B5FD;font-weight:600">
              <span>Complexidade do Prompt</span>
              <span style="color:#C084FC">${diag.complexidadeNivel} · ${diag.score}/100</span>
            </div>
            <div class="meter-track">
              <div class="meter-fill" style="width:${diag.score}%"></div>
            </div>
            <div style="font-size:11px;color:#A78BFA;display:flex;justify-content:space-between">
              <span>Densidade: ${S.ia.habilidades.length > 120 ? 'Alta' : 'Moderada'}</span>
              <span>Transbordo: ${(S.ia.smartJump || []).length} regras</span>
            </div>
          </div>

          <div style="background:#221045;border:1px solid #361B66;border-radius:8px;padding:11px 12px;margin:10px 0">
            <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#C4B5FD;font-weight:700;margin-bottom:6px">Diagnóstico de Ambiguidades</div>
            ${diag.ambiguidades.map(a => `
              <div class="ambig-item">
                <span class="${a.tipo === 'ok' ? 'ambig-ok' : 'ambig-warn'}">${a.tipo === 'ok' ? '✓' : '⚠'}</span>
                <span style="color:${a.tipo === 'ok' ? '#EDE9FE' : '#FDE68A'}">${esc(a.txt)}</span>
              </div>
            `).join("")}
            <button class="btn-g" style="color:#C084FC;font-size:12px;margin-top:6px;padding:0" onclick="otimizarIaAuditora()">✨ Otimizar regras com a Auditora</button>
          </div>

          ${line("Nome do Agente", S.ia.nome || "—", !S.ia.nome)}
          ${line("Roteamento Inteligente", `${(S.ia.smartJump || []).length} regra(s)`, !(S.ia.smartJump && S.ia.smartJump.length))}
          ${line("Fluxos de Triagem", `${totalFluxos} fluxo(s) · ${totalPassos} passo(s)`, !totalPassos)}
          ${line("Base Conhecimento", S.ia.baseUrl ? "Vinculada" : "Pendente", !S.ia.baseUrl)}
          ${line("Integração de Sistema", S.contrato.integracao ? (S.integ.sistema || "Aguardando") : "Não contratado", !S.integ.sistema)}

          <button class="btn btn-p" style="width:100%;margin-top:12px;background:linear-gradient(135deg,#9333EA,#7C3AED);border:0;display:flex;align-items:center;justify-content:center;gap:6px" onclick="abrirModalPromptFinal()">
            👁️ Visualizar Prompt Final da IA
          </button>

          ${pend.length ? `
            <div class="pend">
              <h4>Falta preencher (${pend.length})</h4>
              ${pend.slice(0, 5).map(p => `<button onclick="go('${p.id}')">→ ${esc(p.txt)}</button>`).join("")}
              ${pend.length > 5 ? `<button onclick="go('revisao')">→ e mais ${pend.length - 5}…</button>` : ""}
            </div>
          ` : `
            <div class="done-box">Tudo pronto! Setup 100% preenchido.</div>
          `}
        `;
      } else {
        // Assistente de IA NÃO contratado -> Mostra apenas o resumo dos módulos e o feedback do que falta preencher
        const modulos = [];
        if (c.whats) modulos.push("WhatsApp");
        if (c.voz) modulos.push("Voz / Telefonia");
        if (c.integracao) modulos.push("Integração");

        sumEl.innerHTML = `
          <h3>Resumo do Onboarding</h3>
          <p class="cli">${esc(c.razaoSocial || "Cliente ORPEN")}</p>

          ${line("Módulos Ativos", modulos.length ? modulos.join(", ") : "Nenhum selecionado", !modulos.length)}
          ${c.whats ? line("WhatsApp", S.whats.wabaTipo === 'cloud' ? 'Cloud API' : 'On-Premises', false) : ""}
          ${c.voz ? line("Voz / Telefonia", S.voz.ura === 'sim' ? 'Com URA' : 'Sem URA', false) : ""}
          ${c.integracao ? line("Integração", S.integ.sistema || "Aguardando", !S.integ.sistema) : ""}

          ${pend.length ? `
            <div class="pend">
              <h4>Falta preencher (${pend.length})</h4>
              ${pend.slice(0, 5).map(p => `<button onclick="go('${p.id}')">→ ${esc(p.txt)}</button>`).join("")}
              ${pend.length > 5 ? `<button onclick="go('revisao')">→ e mais ${pend.length - 5}…</button>` : ""}
            </div>
          ` : `
            <div class="done-box">Tudo pronto! Setup 100% preenchido.</div>
          `}
        `;
      }
    }

    function toast(m) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = m;
      t.classList.add("on");
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove("on"), 2600);
    }

    document.addEventListener("input", e => {
      const p = e.target.dataset.path;
      if (!p) return;
      set(p, e.target.value);
      soft();
    });

    function enviar() {
      const p = allPending();
      toast(p.length ? `Enviado com ${p.length} item(ns) pendente(s) — a ORPEN vai cobrar por aqui.` : "Setup enviado. A ORPEN inicia o provisionamento.");
    }

    function baixarJSON() {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `orpen-setup-${(S.contrato.razaoSocial || 'cliente').toLowerCase().replace(/\s+/g, '-')}.json`;
      a.click();
      toast("JSON do setup baixado com sucesso!");
    }

    // Inicialização
    draw();
  </script>
</body>
</html>
